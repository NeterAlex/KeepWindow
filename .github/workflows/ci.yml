name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      package-version:
        description: Version of the checked and packaged application
        value: ${{ jobs.windows.outputs.package-version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  windows:
    name: Windows x64
    needs: format
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      package-version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # These tests share native window classes, hooks, and desktop state.
      - name: Run tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Build release
        run: cargo build --locked --release --all-features

      - name: Package application
        id: package
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataJson | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'keep-window' }
          $version = $package.version
          if (-not $version) { throw 'Could not determine the application version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "KeepWindow-v$version-windows-x64.zip"
          Compress-Archive -Path target/release/keep-window.exe, README.md, README.en.md, LICENSE, locales -DestinationPath "dist/$archive" -Force
          $digest = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive`n" | Set-Content -LiteralPath "dist/$archive.sha256" -Encoding ascii -NoNewline

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keep-window-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
