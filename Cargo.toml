[package]
name = "keep-window"
version = "0.3.0"
edition = "2024"
description = "A native Windows utility that protects selected windows from accidental closing"
license = "MIT"

[dependencies]
gpui-kit = "0.7.3"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
# Thin LTO keeps cross-crate optimization while avoiding the slowest full-LTO link.
lto = "thin"
# More units let rustc codegen run in parallel; the binary remains fully optimized.
codegen-units = 16
strip = true
panic = "abort"
